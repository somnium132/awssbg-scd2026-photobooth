    H 70 V 20 H 60 V 30 H 70 V 40 H 60 V 50 H 70 V 60 
    H 60 V 70 H 50 V 60 H 40 V 70 H 30 V 60 H 20 V 70 
    H 10 V 60 H 0 V 50 H 10 V 40 H 0 V 30 H 10 V 20 
    H 0 V 10 H 10 Z 
    M 20 20 
    H 50 V 50 H 20 Z" 
  />

</svg>
